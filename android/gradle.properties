org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# CI (cold Gradle cache) resolves the whole AGP dependency tree from Maven
# Central in one burst and can get 429 Too Many Requests back -- retry with
# backoff instead of failing the build outright on a transient rate limit.
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=500
