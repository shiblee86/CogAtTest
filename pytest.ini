[pytest]
testpaths = tests
python_files = test_*.py
markers =
    unit: fast tests of a single function in isolation (no UI interaction)
    integration: tests that drive the real UI end-to-end across multiple functions
    regression: tests that lock in previously verified behavior so it can't silently break again
    android: build/manifest/asset-sync checks for the android/ wrapper (needs a JDK + Android SDK; skips cleanly if absent)
