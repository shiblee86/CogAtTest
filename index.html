<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Safia's CogAT Detective Academy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap');

    :root {
      --bg: #f5f0ff;
      --text: #1e1245;
      --panel: #ffffff;
      --panel-border: #ede5ff;
      --card-bg: #ffffff;
      --header-start: #1e1245;
      --header-end: #4a2d9c;
      --pink: #e91e8c;
      --gold: #f5c518;
      --purple: #7c3aed;
      --green: #16a34a;
      --choice-bg: #faf7ff;
      --choice-border: #ddd5f8;
      --correct-bg: #dcfce7;
      --correct-text: #15803d;
      --wrong-bg: #fee2e2;
      --wrong-text: #b91c1c;
      --tip-bg: #fffbeb;
      --tip-border: #f5c518;
      --shadow: 0 4px 16px rgba(30,18,69,0.08);
      --shadow-hover: 0 10px 30px rgba(30,18,69,0.15);
      --focus: #f5c518;
      --muted: #7c6fa0;
    }

    body.dark {
      --bg: #0f0a1e;
      --text: #f0ebff;
      --panel: #1a1230;
      --panel-border: #2d2050;
      --card-bg: #1a1230;
      --header-start: #0a0618;
      --header-end: #1e1245;
      --choice-bg: #241a3d;
      --choice-border: #3d2d66;
      --correct-bg: #0f2d1a;
      --correct-text: #6ee7a0;
      --wrong-bg: #2d0f0f;
      --wrong-text: #fca5a5;
      --tip-bg: #1e1a0a;
      --tip-border: #f5c518;
      --shadow: 0 4px 16px rgba(0,0,0,0.4);
      --shadow-hover: 0 10px 30px rgba(0,0,0,0.5);
      --muted: #9d8fcc;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
      .confetti { display: none !important; }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      transition: background 0.25s, color 0.25s;
    }

    .app { max-width: 1100px; margin: 0 auto; }

    /* ── HEADER ── */
    .header {
      background: linear-gradient(135deg, var(--header-start), var(--header-end));
      border-radius: 28px;
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-hover);
    }
    .header-logo { display: flex; align-items: center; gap: 12px; }
    .header-logo .badge-icon { font-size: 2.4rem; }
    .header-logo h1 { font-family: 'Fredoka One', cursive; color: var(--gold); font-size: 1.5rem; line-height: 1.1; }
    .header-logo p { color: #d4b8ff; font-size: 0.75rem; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
    .header-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .trophy-count { background: rgba(255,255,255,0.12); border-radius: 40px; padding: 8px 18px; display: flex; gap: 16px; }
    .tc-item { text-align: center; }
    .tc-item .num { font-family: 'Fredoka One', cursive; font-size: 1.8rem; color: var(--gold); line-height: 1; display: block; }
    .tc-item .lbl { font-size: 0.65rem; font-weight: 900; color: rgba(255,255,255,0.8); text-transform: uppercase; letter-spacing: 1px; }
    .theme-btn {
      background: rgba(255,255,255,0.15);
      border: none; border-radius: 30px;
      padding: 8px 16px; color: white;
      font-family: 'Nunito', sans-serif;
      font-weight: 800; font-size: 0.82rem;
      cursor: pointer; transition: background 0.2s;
    }
    .theme-btn:hover { background: rgba(255,255,255,0.25); }

    /* ── TIPS BAR ── */
    .tips-bar {
      background: linear-gradient(135deg, #1e1245, #4a2d9c);
      border-radius: 20px;
      padding: 14px 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
    }
    .tips-bar .tip-icon { font-size: 1.5rem; flex-shrink: 0; }
    .tips-bar p { color: #e8d8ff; font-size: 0.88rem; font-weight: 700; line-height: 1.5; }
    .tips-bar strong { color: var(--gold); }

    /* ── BATTERY SECTIONS ── */
    .battery-section { margin-bottom: 28px; }
    .battery-label {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Fredoka One', cursive;
      font-size: 1.1rem; color: var(--muted);
      margin-bottom: 12px;
      padding-left: 4px;
    }
    .battery-label::after {
      content: ''; flex: 1;
      height: 2px; background: var(--panel-border);
      border-radius: 2px;
    }

    /* ── SUBTEST GRID ── */
    .subtest-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .subtest-card {
      background: var(--card-bg);
      border-radius: 22px;
      padding: 18px;
      border: 2px solid var(--panel-border);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: 6px;
    }
    .subtest-card:hover { transform: translateY(-4px); border-color: var(--gold); box-shadow: var(--shadow-hover); }
    .subtest-card:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .sc-top { display: flex; align-items: flex-start; justify-content: space-between; }
    .sc-icon { font-size: 2rem; }
    .sc-status { font-size: 0.7rem; font-weight: 900; padding: 4px 10px; border-radius: 20px; }
    .status-mastered { background: #dcfce7; color: #15803d; }
    .status-ready { background: #ede5ff; color: #6d28d9; }
    body.dark .status-mastered { background: #0f2d1a; color: #6ee7a0; }
    body.dark .status-ready { background: #2d1a50; color: #c4b5fd; }
    .sc-name { font-family: 'Fredoka One', cursive; font-size: 1.15rem; color: var(--text); }
    .sc-desc { font-size: 0.78rem; color: var(--muted); font-weight: 700; line-height: 1.4; }
    .sc-bar { height: 5px; background: var(--panel-border); border-radius: 3px; overflow: hidden; margin-top: 4px; }
    .sc-bar-fill { height: 100%; background: linear-gradient(90deg, var(--pink), var(--gold)); border-radius: 3px; transition: width 0.4s; }

    /* ── PANEL ── */
    .panel {
      background: var(--panel);
      border-radius: 28px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--panel-border);
    }
    .panel-head {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 10px;
      border-bottom: 2px solid var(--panel-border);
      padding-bottom: 14px; margin-bottom: 20px;
    }
    .panel-head h2 { font-family: 'Fredoka One', cursive; font-size: 1.3rem; color: var(--text); }
    .back-btn {
      background: var(--choice-bg); border: 2px solid var(--choice-border);
      border-radius: 30px; padding: 7px 16px;
      font-family: 'Nunito', sans-serif; font-weight: 800;
      font-size: 0.85rem; color: var(--text);
      cursor: pointer; transition: all 0.15s;
    }
    .back-btn:hover { background: var(--panel-border); }
    .back-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

    /* ── STUDY GUIDE ── */
    .study-content { line-height: 1.7; }
    .kid-tip {
      background: var(--tip-bg); border-left: 5px solid var(--tip-border);
      border-radius: 16px; padding: 14px 18px;
      font-weight: 800; color: var(--text); margin-bottom: 16px;
      font-size: 0.95rem;
    }
    body.dark .kid-tip { background: #1e1a06; }
    .example-box {
      background: var(--choice-bg); border-radius: 16px;
      padding: 14px 18px; margin-bottom: 16px;
      border-left: 5px solid var(--pink); font-size: 0.9rem;
      font-weight: 700; line-height: 1.6;
    }
    .strategy-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .strategy-card {
      background: var(--choice-bg); border-radius: 14px;
      padding: 12px 14px; border: 2px solid var(--choice-border);
      font-size: 0.85rem; font-weight: 700;
    }
    .strategy-card .s-num {
      font-family: 'Fredoka One', cursive;
      font-size: 1.4rem; color: var(--pink); display: block; margin-bottom: 4px;
    }
    .analogy-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 0.82rem; }
    .analogy-table th { background: var(--purple); color: white; padding: 8px 12px; text-align: left; font-weight: 800; }
    .analogy-table td { padding: 7px 12px; border-bottom: 1px solid var(--panel-border); font-weight: 600; }
    .analogy-table tr:nth-child(even) td { background: var(--choice-bg); }

    /* ── TEST TIPS SECTION ── */
    .test-tips-section { margin-top: 16px; }
    .test-tips-section h4 { font-family: 'Fredoka One', cursive; font-size: 1rem; margin-bottom: 10px; color: var(--pink); }
    .tip-list { display: flex; flex-direction: column; gap: 8px; }
    .tip-item { display: flex; align-items: flex-start; gap: 10px; font-size: 0.85rem; font-weight: 700; }
    .tip-dot { width: 24px; height: 24px; border-radius: 50%; background: var(--pink); color: white; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka One', cursive; font-size: 0.9rem; flex-shrink: 0; }

    /* ── BUTTONS ── */
    .btn-group { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
    .btn-primary {
      background: linear-gradient(135deg, var(--pink), #c2185b);
      color: white; border: none; border-radius: 40px;
      padding: 12px 28px;
      font-family: 'Fredoka One', cursive; font-size: 1.1rem;
      cursor: pointer; transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(233,30,140,0.3);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(233,30,140,0.4); }
    .btn-primary:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .btn-green {
      background: linear-gradient(135deg, #22c55e, #15803d);
      box-shadow: 0 4px 12px rgba(34,197,94,0.3);
    }
    .btn-green:hover { box-shadow: 0 6px 20px rgba(34,197,94,0.4); }

    /* ── QUESTION CARD ── */
    .q-meta { font-size: 0.8rem; font-weight: 800; color: var(--muted); margin-bottom: 12px; }
    .q-progress { height: 8px; background: var(--panel-border); border-radius: 6px; overflow: hidden; margin-bottom: 16px; }
    .q-progress-fill { height: 100%; background: linear-gradient(90deg, var(--pink), var(--gold)); border-radius: 6px; transition: width 0.4s; }
    .q-text {
      font-size: 1.05rem; font-weight: 800; line-height: 1.7;
      background: var(--choice-bg); border-radius: 18px;
      padding: 16px 20px; border-left: 5px solid var(--pink);
      margin-bottom: 20px; white-space: pre-line;
    }

    /* Paper folding visual */
    .paper-visual { margin: 12px 0 20px; text-align: center; }
    .paper-visual svg { max-width: 100%; height: auto; }

    /* ── CHOICES ── */
    .choices-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .choice-btn {
      background: var(--choice-bg); border: 3px solid var(--choice-border);
      border-radius: 18px; padding: 14px 10px;
      font-family: 'Nunito', sans-serif; font-weight: 800;
      font-size: 1.2rem; color: var(--text);
      cursor: pointer; transition: all 0.12s;
      min-height: 75px; display: flex;
      align-items: center; justify-content: center;
      text-align: center; line-height: 1.3;
    }
    .choice-btn:hover:not(:disabled) { background: var(--panel-border); border-color: var(--gold); transform: scale(1.02); }
    .choice-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .choice-btn:disabled { cursor: not-allowed; opacity: 0.75; }
    .choice-btn.correct { background: var(--correct-bg); border-color: var(--green); color: var(--correct-text); animation: pop 0.25s ease; }
    .choice-btn.wrong { background: var(--wrong-bg); border-color: #ef4444; color: var(--wrong-text); }
    @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.06)} 100%{transform:scale(1)} }

    /* ── FEEDBACK ── */
    .feedback {
      border-radius: 18px; padding: 14px 18px;
      font-weight: 700; font-size: 0.95rem; line-height: 1.6;
      margin-bottom: 10px;
    }
    .feedback.correct-fb { background: var(--correct-bg); color: var(--correct-text); border-left: 5px solid var(--green); }
    .feedback.wrong-fb { background: var(--wrong-bg); color: var(--wrong-text); border-left: 5px solid #ef4444; }
    .tutor-btn {
      background: var(--gold); border: none; border-radius: 25px;
      padding: 7px 16px; font-family: 'Nunito', sans-serif;
      font-weight: 800; font-size: 0.85rem; cursor: pointer;
      color: var(--header-start); margin-top: 8px;
    }
    .tutor-panel {
      background: var(--tip-bg); border-left: 5px solid var(--tip-border);
      border-radius: 16px; padding: 14px 18px;
      margin-top: 10px; font-weight: 700;
      font-size: 0.9rem; line-height: 1.7;
    }
    body.dark .tutor-panel { background: #1e1a06; }

    /* ── LISTENING CUE (Sentence Completion) ── */
    .listening-cue {
      background: linear-gradient(135deg, #1e1245, #4a2d9c);
      border-radius: 18px; padding: 16px 20px;
      color: white; margin-bottom: 16px;
      display: flex; align-items: center; gap: 14px;
    }
    .listen-icon { font-size: 2.2rem; flex-shrink: 0; }
    .listen-text { font-weight: 800; font-size: 0.95rem; line-height: 1.5; }
    .listen-label { color: var(--gold); font-size: 0.72rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
    .speak-btn {
      background: var(--gold); border: none; border-radius: 20px;
      padding: 6px 14px; cursor: pointer;
      font-family: 'Nunito', sans-serif;
      font-weight: 800; font-size: 0.8rem;
      color: var(--header-start); margin-top: 8px;
    }

    /* ── RESULTS ── */
    .results-card {
      border-radius: 28px; padding: 32px 24px;
      text-align: center; border: 3px solid var(--panel-border);
      background: var(--panel);
    }
    .results-card.pass { border-color: var(--green); background: var(--correct-bg); }
    .results-card.fail { border-color: var(--gold); }
    body.dark .results-card.pass { background: #0f2d1a; }
    .r-trophy { font-size: 4.5rem; margin-bottom: 10px; }
    .r-title { font-family: 'Fredoka One', cursive; font-size: 2rem; color: var(--text); }
    .r-msg { color: var(--muted); font-weight: 700; margin-top: 10px; line-height: 1.6; font-size: 0.95rem; }
    .gifted-badge {
      display: inline-block; background: var(--gold);
      color: var(--header-start); border-radius: 20px;
      padding: 6px 16px; font-weight: 900; font-size: 0.85rem;
      margin-top: 10px;
    }
    .r-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }

    /* ── MASTERY OVERLAY ── */
    .mastery-overlay {
      position: fixed; inset: 0;
      background: rgba(10,5,30,0.85); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .mastery-box {
      background: var(--panel); border-radius: 36px;
      padding: 40px 32px; text-align: center;
      max-width: 340px; width: 90%; color: var(--text);
      border: 3px solid var(--gold);
    }
    .mastery-box h2 { font-family: 'Fredoka One', cursive; font-size: 2rem; color: var(--gold); }
    .mastery-box p { font-weight: 700; margin: 8px 0 20px; color: var(--muted); }

    /* ── CONFETTI ── */
    .confetti {
      position: fixed; pointer-events: none; z-index: 99;
      width: 10px; height: 10px; top: -12px;
      animation: fall linear forwards;
    }
    @keyframes fall { to { transform: translateY(105vh) rotate(900deg); opacity: 0; } }

    /* ── UTILITIES ── */
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
    .hidden { display: none !important; }

    @media (max-width: 600px) {
      .choices-grid { grid-template-columns: 1fr 1fr; }
      .choice-btn { font-size: 1rem; min-height: 65px; }
      .header-logo h1 { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="header-logo">
      <div class="badge-icon">🔎</div>
      <div>
        <h1>CogAT Detective Academy</h1>
        <p>Gifted &amp; Talented Test Prep · Level 8</p>
      </div>
    </div>
    <div class="header-right">
      <div class="trophy-count">
        <div class="tc-item"><span class="num" id="masteredCount">0</span><span class="lbl">Mastered</span></div>
        <div class="tc-item"><span class="num">9</span><span class="lbl">Total</span></div>
      </div>
      <button class="theme-btn" id="themeBtn" aria-pressed="false">🌙 Dark</button>
    </div>
  </header>

  <div id="liveRegion" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- HOME -->
  <div id="homeView">
    <div class="tips-bar">
      <div class="tip-icon">🕵️</div>
      <p>A good detective: <strong>looks at ALL answer choices</strong> before picking one · <strong>eliminates wrong answers</strong> first · <strong>always guesses</strong> (no points taken away!) · comes up with a <strong>"rule"</strong> before choosing</p>
    </div>
    <div id="subtestList"></div>
  </div>

  <!-- DETAIL (study / quiz / results) -->
  <div id="detailView" class="hidden"></div>
</div>

<script>
// ─────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────
const $ = id => document.getElementById(id);
const rand = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const shuffle = arr => { const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]];} return a; };
const uniq = arr => [...new Set(arr.map(String))];
const announce = msg => { const el=$('liveRegion'); if(el) el.textContent=msg; };
const focusEl = sel => setTimeout(()=>{ const el=document.querySelector(sel); if(el){el.setAttribute('tabindex','-1');el.focus();} },60);

// ─────────────────────────────────────────────
//  THEME
// ─────────────────────────────────────────────
let dark = false;
function initTheme() {
  try { dark = localStorage.getItem('cogat_theme')==='dark'; } catch(e){}
  applyTheme();
}
function toggleTheme() {
  dark = !dark;
  applyTheme();
  try { localStorage.setItem('cogat_theme', dark?'dark':'light'); } catch(e){}
}
function applyTheme() {
  document.body.classList.toggle('dark', dark);
  const btn = $('themeBtn');
  if(btn){ btn.textContent = dark ? '☀️ Light' : '🌙 Dark'; btn.setAttribute('aria-pressed', dark); }
}

// ─────────────────────────────────────────────
//  MASTERY STATE
// ─────────────────────────────────────────────
let mastery = {};
function loadMastery() { try { mastery = JSON.parse(localStorage.getItem('cogat_mastery_v16')||'{}'); } catch(e){} updateMasteryCount(); }
function saveMastery() { try { localStorage.setItem('cogat_mastery_v16', JSON.stringify(mastery)); } catch(e){} }
function isMastered(id) { return !!mastery[id]; }
function setMastered(id) { mastery[id]=true; saveMastery(); updateMasteryCount(); }
function updateMasteryCount() { const el=$('masteredCount'); if(el) el.textContent=Object.values(mastery).filter(Boolean).length; }

// ─────────────────────────────────────────────
//  PAPER FOLDING SVG HELPER
// ─────────────────────────────────────────────
function makePaperSVG(punches, foldDir) {
  // foldDir: 'bottom' or 'right'
  const W=260, H=180, r=8;
  const foldLine = foldDir==='bottom' ? H/2 : W/2;
  // punch positions (on the folded half that's visible after fold)
  const punchPositions = [];
  if(foldDir==='bottom') {
    for(let i=0;i<punches;i++) punchPositions.push({x: 60+i*60, y: H*0.75});
  } else {
    for(let i=0;i<punches;i++) punchPositions.push({x: W*0.75, y: 50+i*50});
  }
  const foldLine1 = foldDir==='bottom'
    ? `<line x1="0" y1="${foldLine}" x2="${W}" y2="${foldLine}" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4"/>`
    : `<line x1="${foldLine}" y1="0" x2="${foldLine}" y2="${H}" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4"/>`;
  const foldLabel = foldDir==='bottom'
    ? `<text x="${W/2}" y="${foldLine-6}" text-anchor="middle" font-size="11" fill="#7c3aed" font-weight="800">FOLD</text>`
    : `<text x="${foldLine+6}" y="18" font-size="11" fill="#7c3aed" font-weight="800">FOLD</text>`;
  const circles = punchPositions.map(p=>`
    <circle cx="${p.x}" cy="${p.y}" r="${r}" fill="#e91e8c" opacity="0.85"/>
    <text x="${p.x}" y="${p.y+4}" text-anchor="middle" font-size="10" fill="white" font-weight="900">✂</text>
  `).join('');
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="max-width:280px;border-radius:12px;background:#f0eaff;border:2px solid #ddd5f8;">
    <rect x="2" y="2" width="${W-4}" height="${H-4}" rx="8" fill="#faf7ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <rect x="${foldDir==='bottom'?2:foldLine}" y="${foldDir==='bottom'?foldLine:2}" width="${foldDir==='bottom'?W-4:W/2-2}" height="${foldDir==='bottom'?H/2-2:H-4}" rx="4" fill="#ede5ff" opacity="0.5"/>

// 7. NUMBER ANALOGIES (from PDF — add/subtract/double/halve/triple/divide)
function makeNumberAnalogy() {
  const ops = [
    { name:'add', fn:(a,diff)=>a+diff, desc:'adds' },
    { name:'subtract', fn:(a,diff)=>a-diff, desc:'subtracts' },
    { name:'double', fn:(a)=>a*2, desc:'doubles' },
    { name:'halve', fn:(a)=>a/2, desc:'halves' },
    { name:'triple', fn:(a)=>a*3, desc:'triples' },
  ];
  let op, a1, a2, b1, b2, diff;
  let tries=0;
  do {
    op = ops[rand(0,ops.length-1)];
    diff = rand(2,6);
    if(op.name==='add') { a1=rand(3,9); a2=a1+diff; b1=rand(3,9); b2=b1+diff; }
    else if(op.name==='subtract') { a2=rand(3,9); a1=a2+diff; b2=rand(3,9); b1=b2+diff; }
    else if(op.name==='double') { a1=rand(2,8); a2=a1*2; b1=rand(2,8); b2=b1*2; }
    else if(op.name==='halve') { a2=rand(1,6); a1=a2*2; b2=rand(1,6); b1=b2*2; }
    else { a1=rand(1,4); a2=a1*3; b1=rand(1,4); b2=b1*3; }
    tries++;
  } while(b2!==Math.floor(b2) && tries<20);
  b2=Math.floor(b2);
  const choices = shuffle(uniq([b2,b2+1,b2-1,b2+2].map(String)));
  return {
    type:'number-analogies',
    text:`🔢 NUMBER ANALOGY:\n\nTop: ${a1} → ${a2}  (rule: ${op.desc}${op.name==='add'?` ${diff}`:op.name==='subtract'?` ${diff}`:op.name==='triple'?'s':op.name==='halve'?'s':'s'})\nBottom: ${b1} → ?`,
    choices, correct:String(b2),
    explanation:`Top: ${a1} → ${a2}. Apply same rule to bottom: ${b1} ${op.name==='add'?`+ ${diff}`:op.name==='subtract'?`− ${diff}`:op.name==='double'?'× 2':op.name==='halve'?'÷ 2':'× 3'} = ${b2}`,
    steps:[`📏 Find the rule: ${a1} → ${a2} (${op.name})`,`🦘 Apply to bottom: ${b1} → ${b2}`,`✅ Answer: ${b2}`]
  };
}

  const patterns = [
    // simple: +1
    ()=>{ const s=rand(1,8); const seq=[s,s+1,s+2,s+3,s+4]; return {seq,next:s+5,desc:'+1 each time'}; },
    // simple: +2
    ()=>{ const s=rand(1,8); const seq=[s,s+2,s+4,s+6,s+8]; return {seq,next:s+10,desc:'+2 each time'}; },
    // simple: -1
    ()=>{ const s=rand(10,18); const seq=[s,s-1,s-2,s-3,s-4]; return {seq,next:s-5,desc:'-1 each time'}; },
    // simple: -2
    ()=>{ const s=rand(12,20); const seq=[s,s-2,s-4,s-6,s-8]; return {seq,next:s-10,desc:'-2 each time'}; },
    // A-B-A-B (alternating two values)
    ()=>{ const a=rand(3,7),b=rand(8,14); const seq=[a,b,a,b,a]; return {seq,next:b,desc:'A-B-A-B pattern (alternates between two numbers)'}; },
    // A-A-B-B-C-C
    ()=>{ const s=rand(1,5); const seq=[s,s,s+1,s+1,s+2,s+2].slice(0,5); return {seq,next:seq[5]??s+3,desc:'A-A-B-B-C-C pattern'}; },
    // A-B-C-zero-C-B-A (palindrome)
    ()=>{ const a=rand(1,4),b=rand(5,8),c=rand(9,12); const seq=[a,b,c,0,c,b]; return {seq,next:a,desc:'A-B-C-0-C-B-A palindrome pattern'}; },
    // hop -1,-2,-1,-2
    ()=>{ const s=rand(12,20); const seq=[s,s-1,s-3,s-4,s-6]; return {seq,next:s-7,desc:'hops alternate: -1, -2, -1, -2'}; },
    // hop +1,+2,+1,+2
    ()=>{ const s=rand(2,8); const seq=[s,s+1,s+3,s+4,s+6]; return {seq,next:s+7,desc:'hops alternate: +1, +2, +1, +2'}; },
    // two interleaved sequences
    ()=>{ const a=rand(1,5),b=rand(10,15),da=rand(1,2),db=rand(1,2);
      const seq=[a,b,a+da,b+db,a+da*2]; return {seq,next:b+db*2,desc:`two interleaved sequences (odd positions +${da}, even positions +${db})`}; },
  ];
  const pat = patterns[rand(0,patterns.length-1)]();
  const {seq,next,desc}=pat;
  const choices = shuffle(uniq([next,next+1,next-1,next+2].map(String)));
  return {
    type:'number-series',
    text:`🔢 NUMBER SERIES:\n\nAbacus pattern: ${seq.join(' · ')} · ___\n\nWhat number comes next?`,
    choices, correct:String(next),
    explanation:`Pattern: ${desc}. Next number: ${next}`,
    steps:[`🦘 Look at the hops between numbers: ${seq.slice(0,-1).map((v,i)=>`${seq[i+1]-v>0?'+':''}${seq[i+1]-v}`).join(', ')}`,`📏 Pattern: ${desc}`,`✅ Next: ${next}`]
  };
}

// 9. NUMBER PUZZLES
function makeNumberPuzzle() {
  const types = [
    // a + b + ? = total
    ()=>{ const a=rand(3,9),b=rand(2,7),miss=rand(2,8); const total=a+b+miss;
      return {text:`🧩 ${total} = ${a} + ${b} + ?`,correct:miss,wrong:[miss+1,miss-1,miss+2],steps:[`➕ ${a} + ${b} = ${a+b}`,`❓ ${total} − ${a+b} = ${miss}`]}; },
    // a + ? = total (simpler)
    ()=>{ const a=rand(5,12),miss=rand(3,9); const total=a+miss;
      return {text:`🧩 ${total} = ${a} + ?`,correct:miss,wrong:[miss+1,miss-1,miss+2],steps:[`❓ ${total} − ${a} = ${miss}`]}; },
    // ? + b = total
    ()=>{ const b=rand(4,10),miss=rand(3,8); const total=b+miss;
      return {text:`🧩 ${total} = ? + ${b}`,correct:miss,wrong:[miss+1,miss-1,miss+2],steps:[`❓ ${total} − ${b} = ${miss}`]}; },
    // a - ? = result (subtraction)
    ()=>{ const miss=rand(2,7),result=rand(3,8); const a=result+miss;
      return {text:`🧩 ${a} − ? = ${result}`,correct:miss,wrong:[miss+1,miss-1,miss+2],steps:[`❓ ${a} − ${result} = ${miss}`]}; },
    // a + b + c + ? = total (harder)
    ()=>{ const a=rand(2,6),b=rand(2,5),c=rand(1,4),miss=rand(1,5); const total=a+b+c+miss;
      return {text:`🧩 ${total} = ${a} + ${b} + ${c} + ?`,correct:miss,wrong:[miss+1,miss-1,miss+2],steps:[`➕ ${a}+${b}+${c} = ${a+b+c}`,`❓ ${total}−${a+b+c} = ${miss}`]}; },
  ];
  const t = types[rand(0,types.length-1)]();
  const choices = shuffle(uniq([t.correct,...t.wrong].map(String)).slice(0,4));
  return {
    type:'number-puzzles',
    text:t.text,
    choices, correct:String(t.correct),
    explanation:`${t.steps.join(' → ')}. Answer: ${t.correct}`,
    steps:t.steps.concat([`✅ Answer: ${t.correct}`])
  };
}

// ─────────────────────────────────────────────
function renderHome() {
  $('detailView').classList.add('hidden');
  $('homeView').classList.remove('hidden');
  updateMasteryCount();

  const batteries = ['Verbal 🗣️','Nonverbal 🔷','Quantitative 🔢'];
  const list = $('subtestList');
  list.innerHTML = batteries.map(bat => {
    const subs = SUBTESTS.filter(s=>s.battery===bat);
    return `<div class="battery-section">
      <div class="battery-label">${bat}</div>
      <div class="subtest-grid">${subs.map(renderCard).join('')}</div>
    </div>`;
  }).join('');

  list.querySelectorAll('.subtest-card').forEach(card => {
    const open = ()=>openSubtest(card.dataset.id);
    card.addEventListener('click', open);
    card.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();open();} });
  });
  announce('CogAT Detective Academy home — choose a game!');
}

function renderCard(st) {
  const done = isMastered(st.id);
  return `<div class="subtest-card" data-id="${st.id}" role="button" tabindex="0" aria-label="Play ${st.name}">
    <div class="sc-top">
      <div class="sc-icon">${st.icon}</div>
      <div class="sc-status ${done?'status-mastered':'status-ready'}">${done?'✅ MASTERED':'🎮 PLAY'}</div>
    </div>
    <div class="sc-name">${st.name}</div>
    <div class="sc-desc">${st.desc}</div>
    <div class="sc-bar"><div class="sc-bar-fill" style="width:${done?100:0}%"></div></div>
  </div>`;
}

// ─────────────────────────────────────────────
//  STUDY VIEW
// ─────────────────────────────────────────────
let currentST = null;

function openSubtest(id) {
  currentST = SUBTESTS.find(s=>s.id===id);
  if(!currentST) return;
  $('homeView').classList.add('hidden');
  $('detailView').classList.remove('hidden');
  renderStudy();
  announce(`Opened ${currentST.name} study guide`);
}

function renderStudy() {
  const st = currentST;
  const ruleList = st.ruleList ? `<div class="strategy-grid">${st.ruleList.map((r,i)=>`<div class="strategy-card"><span class="s-num">${i+1}</span>${r}</div>`).join('')}</div>` : '';

    <div class="panel">
      <div class="panel-head">
        <h2>${st.icon} ${st.name} · Study Guide</h2>
        <button class="back-btn" id="backBtn">← Back</button>
      </div>
      <div class="study-content">

        ${ruleList}
        <div class="test-tips-section">
          <h4>🕵️ Detective Tips:</h4>
          <div class="tip-list">${st.testTips.map((t,i)=>`<div class="tip-item"><div class="tip-dot">${i+1}</div><span>${t}</span></div>`).join('')}</div>
        </div>
      </div>

// ─────────────────────────────────────────────
//  SESSION (quiz or exam)
// ─────────────────────────────────────────────
let session = null;

function startSession(mode) {
  const n = mode==='quiz' ? currentST.quizN : currentST.examN;
  const questions = Array.from({length:n}, ()=>currentST.gen());
  session = { mode, questions, idx:0, score:0, answers:[] };
  renderQuestion();
  announce(`Starting ${mode} with ${n} questions`);
}

function renderQuestion() {
  const {mode,questions,idx,score}=session;
  const q=questions[idx];
  const total=questions.length;
  const pct=Math.round((idx/total)*100);

  let content='';

  if(q.type==='sentence-completion') {
    content=`
      <div class="listening-cue">
        <div class="listen-icon">👂</div>
        <div>
          <div class="listen-label">Listen carefully — read this question aloud:</div>
          <div class="listen-text">"${q.sentence}"</div>
          <button class="speak-btn" id="speakBtn">🔊 Read Aloud</button>
        </div>
      </div>
      <div class="q-text">Pick the picture that answers the question:</div>`;
  } else if(q.type==='paper-folding') {
    content=`<div class="q-text">${q.qText}</div>`;
    if(q.svgHTML) content+=`<div class="paper-visual">${q.svgHTML}</div>`;
  } else {
    content=`<div class="q-text">${q.text}</div>`;
  }

  $('detailView').innerHTML=`
    <div class="panel">
      <div class="panel-head">
        <h2>${mode==='quiz'?'🎮 Practice Quiz':'🏆 Mastery Exam'} · ${currentST.name}</h2>
        <button class="back-btn" id="exitBtn">✕ Exit</button>
      </div>
      <div class="q-meta">Question ${idx+1} of ${total} · ⭐ Score: ${score}/${idx}</div>
      <div class="q-progress"><div class="q-progress-fill" style="width:${pct}%"></div></div>
      ${content}
      <div class="choices-grid" id="choicesGrid"></div>
      <div id="feedbackArea"></div>
      <button class="btn-primary hidden" id="nextBtn">${idx+1<total?'Next Question →':'See Results 🏆'}</button>
    </div>`;

  $('exitBtn').onclick=renderHome;
  if(q.type==='sentence-completion') {
    const sb=$('speakBtn');
    if(sb) sb.onclick=()=>{ if('speechSynthesis' in window){ const u=new SpeechSynthesisUtterance(q.sentence); u.rate=0.85; speechSynthesis.speak(u); } };
  }

  const grid=$('choicesGrid');
  q.choices.forEach(ch=>{
    const btn=document.createElement('button');
    btn.className='choice-btn'; btn.textContent=ch;
    btn.setAttribute('aria-label',`Choose ${ch}`);
    btn.onclick=()=>handleAnswer(ch,btn);
    grid.appendChild(btn);
  });
  $('nextBtn').onclick=advanceSession;
  focusEl('#choicesGrid .choice-btn');
}

function handleAnswer(selected, btn) {
  if(session.locked) return;
  session.locked=true;
  const q=session.questions[session.idx];
  const correct=selected===q.correct;
  if(correct) session.score++;
  session.answers.push({correct,selected,correctAnswer:q.correct});

  document.querySelectorAll('.choice-btn').forEach(b=>{
    b.disabled=true;
    if(b.textContent===q.correct) b.classList.add('correct');
    else if(b===btn&&!correct) b.classList.add('wrong');
  });

  const fb=$('feedbackArea');
  fb.innerHTML=`<div class="feedback ${correct?'correct-fb':'wrong-fb'}">
    ${correct?'✅ Correct! ':'❌ Not quite. '} ${q.explanation}
    ${!correct?`<br><button class="tutor-btn" id="tutorBtn">🦉 Show me step-by-step</button>`:''}
  </div>`;

  if(!correct) {
    $('tutorBtn')?.addEventListener('click',()=>{
      if(!fb.querySelector('.tutor-panel')) {
        fb.insertAdjacentHTML('beforeend',`<div class="tutor-panel">🦉 <strong>Step-by-step:</strong><br><br>${q.steps.map(s=>`📌 ${s}`).join('<br><br>')}</div>`);
        $('tutorBtn').style.display='none';
      }
    });
  }
  $('nextBtn').classList.remove('hidden');
  setTimeout(()=>{ $('nextBtn')?.focus(); },50);
  announce(correct?`Correct! ${q.explanation}`:`Incorrect. ${q.explanation}`);
}

function advanceSession() {
  session.locked=false;
  session.idx++;
  if(session.idx<session.questions.length) renderQuestion();
  else finishSession();
}

function finishSession() {
  const {mode,score,questions,answers}=session;
  const total=questions.length;
  const pct=Math.round((score/total)*100);
  const pass=pct>=80;
  const gifted=pct>=95;

  if(mode==='exam'&&pass) setMastered(currentST.id);

  const trophy=pass?'🏆':'📚';
  const title=pass?(mode==='exam'?`MASTERED! ${score}/${total}`:`Quiz Passed! ${score}/${total}`):`Score: ${score}/${total}`;
  const msg=pass
    ? (mode==='exam'?`Outstanding! You mastered ${currentST.name}! 🎉`:`Great work! Now try the Mastery Exam to earn your trophy!`)
    : `You need 80% to pass. Review the study guide and try again!`;

  $('detailView').innerHTML=`
    <div class="results-card ${pass?'pass':'fail'}">
      <div class="r-trophy">${trophy}</div>
      <div class="r-title">${title}</div>
      ${gifted&&pass?`<div class="gifted-badge">⭐ GIFTED READY (95%+)!</div>`:''}
      <div class="r-msg">${msg}<br><br>
        ${total>0?`<strong>Correct: ${score}/${total} (${pct}%)</strong><br>Need 80% to pass · 95%+ = Gifted Ready`:''}</div>
      <div class="r-actions">
        ${pass&&mode==='quiz'?`<button class="btn-primary btn-green" id="examBtn">🏆 Try Mastery Exam</button>`:''}
        ${!pass?`<button class="btn-primary" id="retryBtn">🔄 Try Again</button>`:''}
        <button class="btn-primary" id="studyBtn">📖 Study Guide</button>
        <button class="back-btn" id="homeBtn">🏠 Home</button>
      </div>
    </div>`;

  $('homeBtn').onclick=renderHome;
  $('studyBtn').onclick=renderStudy;
  $('retryBtn')?.addEventListener('click',()=>startSession(mode));
  $('examBtn')?.addEventListener('click',()=>startSession('exam'));

  if(mode==='exam'&&pass) { launchConfetti(); showMasteryFlash(); }
  announce(pass?`${mode==='exam'?'Mastered':'Quiz passed'}: ${score} out of ${total}`:`Score: ${score} of ${total}. Keep practicing!`);
}

// ─────────────────────────────────────────────
//  MASTERY FLASH + CONFETTI
// ─────────────────────────────────────────────
function showMasteryFlash() {
  const div=document.createElement('div'); div.className='mastery-overlay';
  div.innerHTML=`<div class="mastery-box">
    <div style="font-size:4rem">🏆</div>
    <h2>MASTERED!</h2>
    <p>${currentST.name} complete!<br>Keep going — you're a detective! 🔎</p>
    <button class="btn-primary" id="flashClose">Continue 🚀</button>
  </div>`;
  document.body.appendChild(div);
  const timer=setTimeout(()=>div.remove(),5000);
  $('flashClose').onclick=()=>{ clearTimeout(timer); div.remove(); };
  setTimeout(()=>$('flashClose')?.focus(),60);
}

function launchConfetti() {
  const colors=['#e91e8c','#f5c518','#7c3aed','#22c55e','#3b82f6','#ff6b35'];
  for(let i=0;i<80;i++) setTimeout(()=>{
    const c=document.createElement('div'); c.className='confetti';
    c.style.cssText=`left:${Math.random()*100}vw;background:${colors[rand(0,colors.length-1)]};
      width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;
      border-radius:${Math.random()>.5?'50%':'3px'};
      animation-duration:${1.5+Math.random()*2}s;`;
    document.body.appendChild(c); setTimeout(()=>c.remove(),3500);
  },i*20);
}

  initTheme();
  loadMastery();
